name: Build macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter & macOS environment
        run: flutter doctor -v

      - name: Run Monorepo Unit & Integration Tests
        run: |
          cd packages/billing_engine && dart test
          cd ../database && dart test
          cd ../sync_protocol && dart test
          cd ../../apps/desktop && flutter test

      - name: Build macOS Release App
        run: |
          cd apps/desktop
          flutter build macos --release

      - name: Package macOS App Bundle
        run: |
          mkdir -p dist
          cd apps/desktop/build/macos/Build/Products/Release
          zip -r -y ../../../../../../dist/WebotApp-Departmental-POS-macOS-v1.0.0.zip "WebotApp Departmental POS.app"
          ls -lh ../../../../../../dist

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebotApp-Departmental-POS-macOS
          path: dist/WebotApp-Departmental-POS-macOS-v1.0.0.zip

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WebotApp-Departmental-POS-macOS-v1.0.0.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
