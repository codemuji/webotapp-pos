name: mobile
description: "Grocery POS - Mobile Cashier Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  billing_engine:
    path: ../../packages/billing_engine
  database:
    path: ../../packages/database
  sync_protocol:
    path: ../../packages/sync_protocol

  flutter_riverpod: ^2.6.1
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.5.0
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.3.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  archive: ^4.1.0

flutter:
  uses-material-design: true
